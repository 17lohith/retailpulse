# Deploys the web app + API to Google Cloud Run. NOT ACTIVE until the cloud teammate completes retailpulse/cloud/RUNBOOK_FOR_TEAMMATE.md
# and sets the repository variables / secrets below. Manual trigger only.
name: Deploy to Cloud Run
on:
  workflow_dispatch:
    inputs:
      region: { description: "Cloud Run region", default: "asia-south1" }
permissions: { contents: read, id-token: write }
jobs:
  deploy:
    if: ${{ vars.GCP_PROJECT_ID != '' }}
    runs-on: ubuntu-latest
    env:
      PROJECT: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ inputs.region }}
      REPO: ${{ vars.GCP_ARTIFACT_REPO || 'retailpulse' }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker $REGION-docker.pkg.dev --quiet
      - name: Build and push images
        run: |
          for svc in backend:backend frontend:web; do
            dir=${svc%%:*}; name=${svc##*:}
            docker build -t $REGION-docker.pkg.dev/$PROJECT/$REPO/$name:${{ github.sha }} retailpulse/$dir
            docker push $REGION-docker.pkg.dev/$PROJECT/$REPO/$name:${{ github.sha }}
          done
      - name: Deploy API
        run: |
          gcloud run deploy retailpulse-api --image $REGION-docker.pkg.dev/$PROJECT/$REPO/backend:${{ github.sha }} --region $REGION \
            --allow-unauthenticated --port 4000 --set-secrets MONGO_URI=retailpulse-mongo-uri:latest,JWT_SECRET=retailpulse-jwt:latest --min-instances 0 --max-instances 3
      - name: Deploy web
        run: |
          gcloud run deploy retailpulse-web --image $REGION-docker.pkg.dev/$PROJECT/$REPO/web:${{ github.sha }} --region $REGION --allow-unauthenticated --port 80 --min-instances 0 --max-instances 3
